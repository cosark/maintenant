---
# Scenario 4 of the bench plan, Freeze of the cluster agent, without a crash.
#
# The numbers 1 to 12 belong to the plan permanently and are never reused, not
# even in a mode where the scenario has no object (FR-047). `expected` is filled
# in by the phase that implements the mode; a scenario whose expectation is
# still empty is reported as such, never as passed.
id: 4
slug: cluster-agent-freeze
name: Freeze of the cluster agent, without a crash
source: bench plan
repetitions: 1
injection:
  'on': active
  command: pkill -STOP -x om || systemctl kill -s SIGSTOP opensvc-server.service
repair:
  'on': host
  command: virsh domstate "$LAB_ACTIVE_DOMAIN" | grep -q "shut off" && virsh start "$LAB_ACTIVE_DOMAIN"
    || $LAB_SSH_ACTIVE "sudo -n pkill -CONT -x om"
settle_s: 60
verify:
  'on': measurement
  command: curl -fsS -m 5 "http://$LAB_SERVICE_ADDRESS:8080/api/v1/health" >/dev/null
measures:
- rto_ms
- nodes_written
- alerts_induced
- failover_count
- agent_watchdog_restart
modes:
  ip-only:
    applicable: true
    expected: 'The cluster agent runs under systemd with a 5 s watchdog. The frozen daemon
      stops answering it, so systemd kills it within that limit and restarts it, long before
      the heartbeat expires. The peer sees a daemon restart, not a node loss. The service stays
      on the same node: no failover and no fencing. Data is local to each node in this mode,
      so writes are not compared.'
  postgres/streaming:
    applicable: true
    expected: 'The cluster agent runs under systemd with a 5 s watchdog. The frozen daemon
      stops answering it, so systemd kills it within that limit and restarts it, long before
      the heartbeat expires. The peer sees a daemon restart, not a node loss. The service, the
      primary and the service address stay on the same node: no failover, no promotion and no
      fencing. No acknowledged write is lost.'
  sqlite/drbd:
    applicable: true
    expected: 'The cluster agent runs under systemd with a 5 s watchdog. The frozen daemon
      stops answering it, so systemd kills it within that limit and restarts it, long before
      the heartbeat expires. The peer sees a daemon restart, not a node loss. The service and
      the volume stay on the same node: no failover and no fencing. No acknowledged write is
      lost.'
  postgres/drbd:
    applicable: true
    expected: 'The cluster agent runs under systemd with a 5 s watchdog. The frozen daemon
      stops answering it, so systemd kills it within that limit and restarts it, long before
      the heartbeat expires. The peer sees a daemon restart, not a node loss. The service and
      the volume stay on the same node: no failover and no fencing. No acknowledged write is
      lost.'
note: The freeze of a whole node, which the heartbeat does detect and which must end in a
  fencing, is scenario 23.
