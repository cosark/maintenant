---
# Scenario 19, specific to the replicated modes. Numbers 1 to 12 belong to the
# bench plan; the allocation of the others is fixed in README.md.
id: 19
slug: giveback
name: Full giveback to the preferred node
source: postgres/streaming
repetitions: 1
start_on: preferred
injection:
  'on': active
  command: om "$LAB_SERVICE" switch --wait
repair:
  'on': host
  command: |
    set -eu
    case "$LAB_MODE" in
    postgres/streaming)
      $LAB_SSH_ACTIVE "sudo -n systemctl stop maintenant-pg-watch.service 'postgresql@*.service'"
      refused="$LAB_ACTIVE is not a caught-up standby"
      restore="sudo -n systemctl start maintenant-pg-watch.service"
      ;;
    sqlite/drbd)
      $LAB_SSH_ACTIVE "sudo -n drbdadm disconnect maintenant"
      refused="the volume on $LAB_ACTIVE is not an up-to-date copy of $LAB_PASSIVE"
      restore="sudo -n drbdadm adjust maintenant"
      ;;
    esac
    if refusal=$("$LAB_CLI" giveback 2>&1); then
      echo "giveback was accepted while the copy on $LAB_ACTIVE was cut off" >&2
      exit 1
    fi
    case "$refusal" in
    *"$refused"*) ;;
    *)
      printf 'giveback was refused for another reason than the cut-off copy: %s\n' "$refusal" >&2
      exit 1
      ;;
    esac
    $LAB_SSH_ACTIVE "$restore"
    tries=0
    until "$LAB_CLI" giveback; do
      tries=$((tries + 1))
      if [ "$tries" -ge 30 ]; then
        echo "giveback to $LAB_ACTIVE was still refused after its copy came back" >&2
        exit 1
      fi
      sleep 10
    done
verify:
  'on': host
  command: |
    set -eu
    curl -fsS -m 5 "http://$LAB_SERVICE_ADDRESS:8080/api/v1/health" | jq -e '.storage.connected == true' >/dev/null
    case "$LAB_MODE" in
    postgres/streaming) role="sudo -n /usr/local/sbin/maintenant-pg-state" primary='.role == "primary"' ;;
    sqlite/drbd) role="sudo -n drbdsetup status --json maintenant" primary='.[0].role == "Primary"' ;;
    esac
    primaries=0
    for node in "$LAB_SSH_ACTIVE" "$LAB_SSH_PASSIVE"; do
      if $node "$role" 2>/dev/null | jq -e "$primary" >/dev/null; then
        primaries=$((primaries + 1))
      fi
    done
    [ "$primaries" -eq 1 ]
measures:
- rto_ms
- writes
- primary_count
- former_primary_rebuild
modes:
  ip-only:
    applicable: false
    reason: no replicated copy to compare in this mode; scenario 1 covers the move itself
  postgres/streaming:
    applicable: true
    expected: 'The service is switched away from the preferred node, which is rebuilt as a
      standby. lab giveback is refused while the copy on the preferred node is stopped, and
      refused again until it is a caught-up standby, streaming, synchronous and zero bytes
      behind. Once it is, the giveback stops the primary cleanly, promotes the preferred node,
      and the other node is rebuilt as its standby by pg_rewind with nothing to rewind. No
      acknowledged write is lost; exactly one node holds the service throughout.'
  sqlite/drbd:
    applicable: true
    expected: 'The service is switched away from the preferred node, whose volume stays
      connected as Secondary. lab giveback is refused while the volume on the preferred node
      is disconnected, and refused again until it is UpToDate, Connected to the holder and has
      nothing out of sync. Once it is, the giveback stops the application, unmounts and
      demotes the volume on the holder, then promotes and mounts it on the preferred node. No
      acknowledged write is lost; exactly one node is Primary throughout.'
  postgres/drbd:
    applicable: false
    reason: no service template for this mode yet
