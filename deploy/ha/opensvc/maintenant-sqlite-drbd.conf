# The state root sits on a DRBD volume replicated in protocol C. The volume stays
# connected as secondary on the passive node; the service promotes it, mounts it
# and starts the binary, and stops in reverse: the binary closes its journal, the
# unmount flushes the file system, the volume is demoted.

[DEFAULT]
nodes = {{ groups['opensvc_cluster'] | join(' ') }}
topology = failover
orchestrate = ha

# om3 never gives the service back on its own (FR-012).
placement = nodes order

# Without this the fencing callout is never called (FR-024).
stonith = true

monitor_action = {{ opensvc_service_monitor_action }}
monitor_schedule = {{ opensvc_service_monitor_schedule }}

[ip#0]
name = {{ ha_service_address }}
blocking_pre_start = {{ opensvc_service_fence_guard }}
{% for node in groups['opensvc_cluster'] %}
dev@{{ node }} = {{ hostvars[node].opensvc_service_interface }}
netmask@{{ node }} = {{ hostvars[node].opensvc_service_prefix }}
{% endfor %}
monitor = true
restart = {{ opensvc_service_ip_restart }}
restart_delay = {{ opensvc_service_ip_restart_delay }}

# Start promotes, stop demotes; standby keeps the passive copy connected.
[disk#drbd]
type = drbd
res = {{ drbd_resource }}
standby = true
monitor = true

[fs#0]
type = ext4
dev = {{ drbd_device }}
mnt = {{ maintenant_state_dir }}
mnt_opt = defaults,noatime,barrier=1
user = {{ maintenant_user }}
group = {{ maintenant_user }}
perm = 0750
monitor = true

# Not app.simple: it judges the start 20 ms after the launch, before the binary answers.
[app#0]
type = forking
start = {{ maintenant_start_script }}
stop = {{ maintenant_stop_script }}
start_timeout = {{ maintenant_start_timeout_seconds | int + 10 }}s
stop_timeout = {{ maintenant_start_term_wait_seconds | int + 5 }}s
environment = {% for name, value in maintenant_settings.items() %}{{ name }}={{ value }}{{ '' if loop.last else ' ' }}{% endfor %}

user = {{ maintenant_user }}
cwd = {{ maintenant_state_dir }}
check = {{ maintenant_check_script }}
check_timeout = {{ maintenant_check_timeout_seconds | int + 2 }}s

# Degraded (1) stays up so om3 neither restarts nor fails over; status_log shows why.
retcodes = 0:up 1:up 2:down
status_log = true
monitor = true
restart = {{ opensvc_service_app_restart }}
restart_delay = {{ opensvc_service_app_restart_delay }}
